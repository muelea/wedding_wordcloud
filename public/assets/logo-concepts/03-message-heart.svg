<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="726"
     height="672"
     viewBox="0 0 726 672"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Three overlapping speech bubbles with a heart</title>
  <desc id="desc">A rose circle behind two interlocking pink and burgundy speech bubbles. Their overlap forms a transparent heart.</desc>

  <defs>
    <radialGradient id="rose-back" gradientUnits="userSpaceOnUse"
                    cx="370" cy="301" r="248"
                    fx="373" fy="321">
      <stop offset="0" stop-color="#d43b68"/>
      <stop offset="0.58" stop-color="#bd2055"/>
      <stop offset="1" stop-color="#aa1243"/>
    </radialGradient>

    <radialGradient id="rose-left" gradientUnits="userSpaceOnUse"
                    cx="292" cy="431" r="321"
                    fx="307" fy="451">
      <stop offset="0" stop-color="#ed7898"/>
      <stop offset="0.58" stop-color="#df597c"/>
      <stop offset="1" stop-color="#d4426b"/>
    </radialGradient>

    <radialGradient id="burgundy-right" gradientUnits="userSpaceOnUse"
                    cx="501" cy="421" r="282"
                    fx="498" fy="430">
      <stop offset="0" stop-color="#750027"/>
      <stop offset="0.62" stop-color="#61001f"/>
      <stop offset="1" stop-color="#4b0018"/>
    </radialGradient>

    <!-- Black areas in this mask become transparent. -->
    <mask id="heart-cutout"
          x="0" y="0" width="726" height="672"
          maskUnits="userSpaceOnUse">
      <rect width="726" height="672" fill="#fff"/>
      <path fill="#000" d="
        M 364 488
        C 350 475, 315 450, 291 427
        C 270 407, 259 385, 260 362
        C 261 336, 278 316, 302 313
        C 330 309, 351 323, 364 344
        C 378 323, 399 309, 426 313
        C 450 316, 467 336, 468 362
        C 469 389, 455 414, 433 436
        C 413 456, 389 475, 364 488
        Z"/>
    </mask>
  </defs>

  <g mask="url(#heart-cutout)">
    <!-- Back bubble -->
    <ellipse id="back-bubble"
             cx="369" cy="244" rx="184.5" ry="186"
             fill="url(#rose-back)"/>

    <!-- Right speech bubble and its pointed tail -->
    <path id="right-bubble" fill="url(#burgundy-right)" d="
      M 364 344
      C 397 278, 458 234, 527 234
      C 628 234, 706 310, 706 407
      C 706 483, 656 543, 577 557
      L 607 611
      C 610 617, 606 620, 599 617
      C 554 601, 516 581, 479 563
      L 229 570
      C 280 554, 326 520, 364 488
      C 398 460, 438 425, 455 396
      C 477 358, 461 320, 428 313
      C 400 307, 378 323, 364 344
      Z"/>

    <!-- Left bubble sits above the lower-left edge of the right bubble. -->
    <path id="left-bubble" fill="url(#rose-left)" d="
      M 364 344
      C 335 282, 274 244, 204 244
      C 104 244, 26 318, 26 410
      C 26 503, 98 572, 193 572
      C 253 572, 303 541, 364 488
      C 331 463, 293 433, 276 408
      C 249 369, 258 331, 301 314
      C 328 308, 350 323, 364 344
      Z"/>
  </g>
</svg>
