<!DOCTYPE html>
<html lang="de" data-theme="pastel">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hochzeit Wortwolke – Anzeige</title>
  <style>
    /* Georgia covers all needed chars incl. German umlauts — no CDN needed */
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Pastel theme (default) ── */
    :root {
      --bg:      #eef6f4;
      --bg2:     #ddeee9;
      --primary: #3d7a96;
      --accent:  #6aae94;
      --text:    #1e3d4a;
      --muted:   #5a8896;
      --border:  rgba(58,120,150,0.14);
      --rad1:    rgba(106,174,148,0.13);
      --rad2:    rgba(58,120,150,0.10);
      --orn:     rgba(58,120,150,0.45);
      --qr-bd:   rgba(58,120,150,0.28);
    }

    /* ── Neon theme ── */
    [data-theme="neon"] {
      --bg:      #000000;
      --bg2:     #000000;
      --primary: #ff10f0;
      --accent:  #00fff2;
      --text:    #f5f0ff;
      --muted:   #b39ddb;
      --border:  rgba(255,16,240,0.30);
      --rad1:    rgba(0,255,242,0.22);
      --rad2:    rgba(191,0,255,0.22);
      --orn:     rgba(191,0,255,0.80);
      --qr-bd:   rgba(255,16,240,0.55);
    }

    /* Real neon needs a flat black backdrop, not a gradient wash */
    [data-theme="neon"] body::before {
      background: var(--bg);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      transition: background 0.6s, color 0.6s;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 10%, var(--rad1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 90%, var(--rad2) 0%, transparent 60%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
      pointer-events: none;
      transition: background 0.6s;
    }

    /* ── Header ── */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 10;
    }

    .header-title { display: flex; flex-direction: column; }

    .header-name {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(22px, 2.8vw, 36px);
      font-weight: 400;
      color: var(--primary);
      transition: color 0.6s;
    }

    .word-counter { text-align: right; }

    .word-counter .count {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 3.5vw, 48px);
      color: var(--primary);
      line-height: 1;
      transition: color 0.6s;
    }

    .word-counter .label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
      transition: color 0.6s;
    }

    /* ── Canvas ── */
    #cloud-container {
      position: fixed;
      top: 80px; left: 0; right: 0; bottom: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cloud-canvas {
      display: block;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    #cloud-canvas.visible { opacity: 1; }

    /* ── Empty state ── */
    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #empty-state.hidden { opacity: 0; }

    .empty-ornament {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(60px, 8vw, 100px);
      color: var(--rad1);
      line-height: 1;
      /* fallback for the rgba var */
      opacity: 0.5;
    }
    .empty-text {
      margin-top: 18px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(18px, 2.5vw, 28px);
      font-style: italic;
      color: var(--muted);
      opacity: 0.7;
      transition: color 0.6s;
    }
    .empty-sub {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.5;
      transition: color 0.6s;
    }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-top: 1px solid var(--border);
      transition: border-color 0.6s;
    }

    .footer-ornament {
      font-size: 13px;
      letter-spacing: 6px;
      color: var(--orn);
      transition: color 0.6s;
    }

    .qr-wrap { display: flex; align-items: center; gap: 14px; }

    .qr-label { text-align: right; }
    .qr-label .line1 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.6s;
    }
    .qr-label .line2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      color: var(--primary);
      margin-top: 2px;
      transition: color 0.6s;
    }

    .qr-code {
      width: 84px; height: 84px;
      border-radius: 10px;
      border: 2px solid var(--qr-bd);
      padding: 3px;
      background: var(--bg);
      transition: border-color 0.6s, background 0.6s;
    }

    /* ── Footer actions (theme toggle / SVG export / new session) ── */
    .footer-actions {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .footer-actions span {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
      transition: opacity 0.3s, color 0.6s;
      cursor: pointer;
      user-select: none;
    }
    .footer-actions span:hover { opacity: 1; }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
    }

    .toast {
      background: var(--primary);
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      padding: 10px 24px;
      border-radius: 999px;
      animation: toastIn 0.3s ease both, toastOut 0.4s ease 1.8s both;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-8px) scale(0.92); }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">
    <span class="header-name" id="couple-name">♡</span>
  </div>
  <div class="word-counter">
    <div class="count" id="word-total">0</div>
    <div class="label">Wörter geteilt</div>
  </div>
</header>

<div id="cloud-container">
  <canvas id="cloud-canvas"></canvas>
  <div id="empty-state">
    <div class="empty-ornament">♡</div>
    <p class="empty-text">Wir warten auf eure Wörter&hellip;</p>
    <p class="empty-sub">QR-Code scannen &amp; mitmachen</p>
  </div>
</div>

<footer class="footer">
  <span class="footer-ornament">· · · ✦ · · ·</span>
  <div class="footer-actions">
    <span id="theme-hint" title="Theme wechseln">Theme</span>
    <span id="export-hint" title="Als SVG exportieren">SVG</span>
    <span id="clear-hint" title="Wörter archivieren & neue Runde starten">Neue Runde</span>
  </div>
  <div class="qr-wrap">
    <div class="qr-label">
      <div class="line1">Scannen &amp; mitmachen</div>
      <div class="line2" id="qr-url"></div>
    </div>
    <img class="qr-code" id="qr-img" src="" alt="QR Code" />
  </div>
</footer>

<div class="toast-container" id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ── Constants & DOM refs (declared first to avoid TDZ errors) ────────────
  const FONT_FAMILY = 'Georgia, "Times New Roman", "Apple Color Emoji", "Segoe UI Emoji", serif';
  // Same font list, but with single quotes — FONT_FAMILY's double quotes
  // would prematurely close the SVG's font-family="..." XML attribute.
  const SVG_FONT_FAMILY = "Georgia, 'Times New Roman', 'Apple Color Emoji', 'Segoe UI Emoji', serif";

  const THEMES = {
    pastel: {
      colors: [
        '#3a7a96', '#5aae8e', '#6a90b0', '#4a9478',
        '#8ac0d8', '#7aaeb4', '#3a6e84', '#8abaaa',
        '#e8846e', '#c0906a',
      ],
    },
    neon: {
      colors: [
        '#ff10f0', '#00fff2', '#bf00ff', '#39ff14',
        '#ffea00', '#ff073a', '#0aff99', '#ff6ec7',
        '#00b3ff', '#ff9500',
      ],
    },
  };

  const canvas         = document.getElementById('cloud-canvas');
  const ctx             = canvas.getContext('2d');
  const container       = document.getElementById('cloud-container');
  const emptyState      = document.getElementById('empty-state');
  const wordTotalEl     = document.getElementById('word-total');
  const toastContainer  = document.getElementById('toast-container');

  let currentWords = [];
  let renderTimer  = null;
  let lastWords    = null;
  const wordColors = new Map();

  // ── Theme ─────────────────────────────────────────────────────────────────
  const urlTheme = new URLSearchParams(location.search).get('theme');
  let currentTheme = (urlTheme === 'neon' || urlTheme === 'pastel') ? urlTheme : 'pastel';

  function applyTheme(t) {
    currentTheme = t;
    wordColors.clear(); // re-assign colors from new palette
    document.documentElement.dataset.theme = t;
    if (currentWords.length > 0) scheduleRender(currentWords);
  }

  applyTheme(currentTheme); // safe: currentWords is already declared above

  function getWordColor(word) {
    if (!wordColors.has(word)) {
      const palette = THEMES[currentTheme].colors;
      wordColors.set(word, palette[wordColors.size % palette.length]);
    }
    return wordColors.get(word);
  }

  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

  // Scale font sizes to the available area per word so a crowded cloud
  // shrinks to fit and a sparse one grows to fill the square nicely.
  function getFontSizeRange(words, side) {
    const density = Math.sqrt((side * side) / words.length);
    const maxPx = clamp(density * 0.85, side * 0.05, side * 0.30);
    // Floor is a % of side (not a fixed px) so it stays readable at both the
    // on-screen size (~700px) and the much larger SVG export canvas (2000px).
    const minPx = clamp(maxPx * 0.24, side * 0.022, maxPx * 0.5);
    return { minPx, maxPx };
  }

  // Longer words are scaled down a bit relative to short ones of the same
  // frequency, so a single long word can't dominate/overflow the square.
  function lengthPenalty(word) {
    return clamp(1 - Math.max(0, word.length - 5) * 0.018, 0.6, 1);
  }

  // Only 4 distinct sizes. Ratio is measured against a floored spread, not
  // the raw max — otherwise a word jumped straight to the biggest tier the
  // moment it equaled a still-tiny current max (e.g. after just its 2nd
  // submission). Flooring the spread means a word needs a real lead over
  // the rest, not just one extra vote early on, before it reads as "big".
  const SIZE_TIERS = [0.3, 0.5, 0.72, 1];
  const MIN_TIER_SPREAD = 6;

  function sizeForCount(word, count, minCount, maxCount, minPx, maxPx) {
    let tierRatio;
    if (maxCount === minCount) {
      tierRatio = 0.6; // no variation yet — keep everything one pleasant size
    } else {
      const spread = Math.max(maxCount - minCount, MIN_TIER_SPREAD);
      const ratio = clamp((count - minCount) / spread, 0, 1);
      const tierIndex = Math.min(SIZE_TIERS.length - 1, Math.floor(ratio * SIZE_TIERS.length));
      tierRatio = SIZE_TIERS[tierIndex];
    }
    const base = minPx + tierRatio * (maxPx - minPx);
    return Math.max(minPx, base * lengthPenalty(word));
  }

  // Exactly 1 in 5 words rotated (20%) — a per-word probability (e.g. a
  // hash-based coin flip) can easily land near 50/50 by chance with the
  // small word counts typical of an event like this, so rotation is
  // assigned by rank in the sorted list instead, which is exact regardless
  // of how many words there are. Also spreads rotated words evenly across
  // the size spectrum rather than clustering them at one end.
  const ROTATE_EVERY_N = 5;

  // Shared spiral+collision layout used by both the live canvas and the SVG
  // export, so the two are always identical by construction — and retries
  // at a smaller size instead of ever dropping a word that doesn't fit.
  function layoutWords(words, side, measureCtx) {
    const counts = words.map(([, c]) => c);
    const maxCount = Math.max(...counts);
    const minCount = Math.min(...counts);
    const { minPx, maxPx } = getFontSizeRange(words, side);

    const sized = words
      .map(([word, count]) => ({ word, fontPx: sizeForCount(word, count, minCount, maxCount, minPx, maxPx) }))
      .sort((a, b) => b.fontPx - a.fontPx);

    sized.forEach((item, i) => { item.rotated = (i % ROTATE_EVERY_N === ROTATE_EVERY_N - 1); });

    const placed = [];
    const cx = side / 2, cy = side / 2;
    const maxRadius = side * 0.72;
    const steps = 2000;

    for (const item of sized) {
      let fontPx = item.fontPx;
      let spot = null;

      for (let attempt = 0; attempt < 8 && !spot; attempt++) {
        measureCtx.font = `${fontPx}px ${FONT_FAMILY}`;
        const textHalf = measureCtx.measureText(item.word).width / 2 + side * 0.004;
        const fontHalf = fontPx / 2 + side * 0.004;
        // Rotated words occupy a footprint with width/height swapped.
        const halfW = item.rotated ? fontHalf : textHalf;
        const halfH = item.rotated ? textHalf : fontHalf;

        for (let t = 0; t < steps; t++) {
          const angle = 0.3 * t;
          const radius = (maxRadius / Math.sqrt(steps)) * Math.sqrt(t);
          const x = cx + radius * Math.cos(angle);
          const y = cy + radius * Math.sin(angle);
          const box = { x1: x - halfW, x2: x + halfW, y1: y - halfH, y2: y + halfH };
          if (box.x1 < 0 || box.y1 < 0 || box.x2 > side || box.y2 > side) continue;
          const collides = placed.some((p) =>
            !(box.x2 < p.x1 || box.x1 > p.x2 || box.y2 < p.y1 || box.y1 > p.y2));
          if (!collides) { spot = { x, y, halfW, halfH }; break; }
        }
        if (!spot) fontPx *= 0.82; // didn't fit at this size — shrink and retry
      }
      if (!spot) continue; // extremely unlikely after 8 shrink attempts

      placed.push({
        word: item.word, fontPx, rotated: item.rotated, x: spot.x, y: spot.y,
        x1: spot.x - spot.halfW, x2: spot.x + spot.halfW,
        y1: spot.y - spot.halfH, y2: spot.y + spot.halfH,
        color: getWordColor(item.word),
      });
    }
    return placed;
  }

  function renderCloud(words) {
    if (!words || words.length === 0) return;

    const rect = container.getBoundingClientRect();
    // Keep a fixed, roughly square drawing area regardless of word count —
    // only the font sizes adapt to make everything fit inside it.
    const side = Math.min(rect.width, rect.height) * 0.94;
    canvas.width = side;
    canvas.height = side;

    const placed = layoutWords(words, side, ctx);

    ctx.clearRect(0, 0, side, side);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    for (const p of placed) {
      ctx.font = `${p.fontPx}px ${FONT_FAMILY}`;
      ctx.fillStyle = p.color;
      if (p.rotated) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(p.word, 0, p.fontPx * 0.34);
        ctx.restore();
      } else {
        ctx.fillText(p.word, p.x, p.y + p.fontPx * 0.34);
      }
    }
    canvas.classList.add('visible');
  }

  function scheduleRender(words) {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => renderCloud(words), 300);
  }

  function showToast(word) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = '✦  ' + word;
    toastContainer.appendChild(toast);
    setTimeout(() => toast.remove(), 2400);
  }

  // ── Config & QR ──────────────────────────────────────────────────────────
  fetch('/config').then(r => r.json()).then(({ coupleName }) => {
    document.getElementById('couple-name').textContent = coupleName;
    document.title = coupleName + ' – Wortwolke';
  });

  fetch('/qr').then(r => r.json()).then(({ dataUrl, url }) => {
    document.getElementById('qr-img').src = dataUrl;
    document.getElementById('qr-url').textContent = url.replace('http://', '');
  });

  // ── Socket ───────────────────────────────────────────────────────────────
  const socket = io();

  socket.on('word-update', (words) => {
    currentWords = words;
    const total = words.reduce((s, [, c]) => s + c, 0);
    wordTotalEl.textContent = total;

    if (words.length === 0) {
      emptyState.classList.remove('hidden');
      canvas.classList.remove('visible');
      return;
    }
    emptyState.classList.add('hidden');

    if (lastWords) {
      const prev = new Map(lastWords);
      for (const [word, count] of words) {
        if (!prev.has(word) || prev.get(word) < count) { showToast(word); break; }
      }
    }
    lastWords = words;
    scheduleRender(words);
  });

  socket.on('theme-change', (t) => {
    if (t === 'neon' || t === 'pastel') {
      applyTheme(t);
    }
  });

  // ── Theme toggle ──────────────────────────────────────────────────────────
  function toggleTheme() {
    const next = currentTheme === 'neon' ? 'pastel' : 'neon';
    applyTheme(next);
    socket.emit('theme-change', next);
  }

  document.getElementById('theme-hint').addEventListener('click', toggleTheme);

  // ── SVG export (for print) ───────────────────────────────────────────────
  // Reuses layoutWords() at a high-resolution square, so the export always
  // matches what's on screen — same words, same relative sizes/positions.
  function escapeXML(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildSVG(placed, side, theme) {
    let defs = '', bg;
    if (theme === 'neon') {
      bg = `<rect width="${side}" height="${side}" fill="#000000"/>`;
    } else {
      defs = `<defs><linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">` +
        `<stop offset="0%" stop-color="#eef6f4"/><stop offset="100%" stop-color="#ddeee9"/>` +
        `</linearGradient></defs>`;
      bg = `<rect width="${side}" height="${side}" fill="url(#bg)"/>`;
    }
    const texts = placed.map((p) => {
      const rotate = p.rotated ? ` transform="rotate(-90 ${p.x.toFixed(1)} ${p.y.toFixed(1)})"` : '';
      return `<text x="${p.x.toFixed(1)}" y="${(p.y + p.fontPx * 0.34).toFixed(1)}" ` +
        `font-size="${p.fontPx.toFixed(1)}" font-family="${SVG_FONT_FAMILY}" ` +
        `fill="${p.color}" text-anchor="middle"${rotate}>${escapeXML(p.word)}</text>`;
    }).join('\n  ');

    return `<?xml version="1.0" encoding="UTF-8"?>\n` +
      `<svg xmlns="http://www.w3.org/2000/svg" width="${side}" height="${side}" viewBox="0 0 ${side} ${side}">\n` +
      `  ${defs}\n  ${bg}\n  ${texts}\n</svg>`;
  }

  function exportSVG() {
    if (!currentWords.length) return;
    const side = 2000; // fixed high-resolution square so print output stays crisp
    const measureCtx = document.createElement('canvas').getContext('2d');
    const placed = layoutWords(currentWords, side, measureCtx);
    const svg = buildSVG(placed, side, currentTheme);
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wortwolke-${currentTheme}-${new Date().toISOString().slice(0, 10)}.svg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById('export-hint').addEventListener('click', exportSVG);

  // ── New session (archive current words on the server, then clear) ───────
  function startNewSession() {
    if (!currentWords.length) return;
    if (!confirm('Aktuelle Wörter archivieren und eine neue Runde starten?')) return;
    fetch('/reset', { method: 'POST' }).catch(() => {});
  }

  document.getElementById('clear-hint').addEventListener('click', startNewSession);

  // ── Resize ───────────────────────────────────────────────────────────────
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentWords.length > 0) renderCloud(currentWords);
    }, 200);
  });
</script>
</body>
</html>
