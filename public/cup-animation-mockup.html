<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wolkenworte – Tassenanimation</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fffdfa;color:#400f26;font:14px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px}button{border:1px solid #eadce2;border-radius:24px;background:white;color:#9c1c4c;padding:10px 18px;cursor:pointer}select{max-width:260px;border:1px solid #eadce2;border-radius:12px;padding:10px;background:white;color:#400f26}iframe{display:block;width:100%;height:calc(100vh - 76px);border:0}</style></head>
<body>
<style>header{flex-wrap:wrap;gap:16px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px}label{display:flex;align-items:center;gap:10px}input{width:clamp(120px,20vw,240px);accent-color:#9c1c4c}output{min-width:48px;font-variant-numeric:tabular-nums}</style>
<header><span>Wolkenworte · Tassenanimation</span><div class="controls"><label for="sequence">Vorschau <select id="sequence"><option value="full" selected>Gesamte Geschichte</option><option value="mug">Nur Tasse</option></select></label><label for="motion">Choreografie <select id="motion"><option value="original">Original</option><option value="clockwork">01 · Magisches Uhrwerk</option><option value="ribbon">02 · Erinnerungsband</option><option value="magnetic">03 · Magnetische Konstellation</option><option value="magnetic-vortex">04 · Sternenwirbel</option><option value="magnetic-wave">05 · Magnetische Wellen</option><option value="magnetic-braid">06 · Sternengeflecht</option><option value="magnetic-glide">07 · Sanftes Gleiten</option><option value="magnetic-fan">08 · Schwebender Fächer</option><option value="magnetic-orbit">09 · Ruhige Umlaufbahn</option><option value="ribbon-airy" selected>10 · Erinnerungsband · Luftiger</option></select></label><label for="speed">Tempo <input id="speed" type="range" min="0.1" max="3" step="0.05" value="1.8"><output id="speed-label" for="speed">1.80×</output></label><label for="rotation-delay">Drehstart <input id="rotation-delay" type="range" min="0" max="1500" step="50" value="500"><output id="rotation-label" for="rotation-delay">0.50 s</output></label><button id="replay" type="button">Erneut abspielen ↻</button></div></header>
<iframe src="/?lang=de&amp;demo=full&amp;motion=ribbon-airy" title="Von den ersten Worten bis zur fertigen Tasse"></iframe>
<script>
const preview=document.querySelector('iframe');
const speed=document.getElementById('speed');
function updateSpeed(){
  document.getElementById('speed-label').value=Number(speed.value).toFixed(2)+'×';
  preview.contentWindow.postMessage({type:'wolkenworte:preview-speed',speed:Number(speed.value)},location.origin);
}
speed.addEventListener('input',updateSpeed);
const rotationDelay=document.getElementById('rotation-delay');
function updateRotationDelay(){
  document.getElementById('rotation-label').value=(Number(rotationDelay.value)/1000).toFixed(2)+' s';
  preview.contentWindow.postMessage({type:'wolkenworte:preview-rotation-delay',delay:Number(rotationDelay.value)},location.origin);
}
rotationDelay.addEventListener('input',updateRotationDelay);
preview.addEventListener('load',()=>{updateSpeed();updateRotationDelay();});
const motion=document.getElementById('motion');
const sequence=document.getElementById('sequence');
function replay(){preview.src='/?lang=de&demo='+encodeURIComponent(sequence.value)+'&motion='+encodeURIComponent(motion.value);}
motion.addEventListener('change',replay);
sequence.addEventListener('change',replay);
document.getElementById('replay').addEventListener('click',replay);
</script>
</body></html>
