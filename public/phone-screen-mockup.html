<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wolkenworte – Phone Screen Mockup</title>
  <style>
    @font-face { font-family: Playfair; src: url('assets/site-fonts/playfair-display/playfair-display-latin.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: Jost; src: url('assets/site-fonts/jost/jost-latin.woff2') format('woff2'); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #fff 0, #faf5f6 55%, #f2e9ed 100%); color: #4b1730; font-family: system-ui, sans-serif; }
    .workspace { position: relative; isolation: isolate; display: grid; gap: 18px; justify-items: center; padding: 48px 70px; }
    .workspace::before { content: ''; position: absolute; z-index: -2; inset: 8% -22%; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #ffd9ca 0, #f8dbe580 27%, #dce7ff65 55%, transparent 75%); filter: blur(22px); }
    .workspace::after { content: ''; position: absolute; z-index: -1; left: 15%; right: 15%; bottom: 10%; height: 18%; border-radius: 50%; background: #71334f24; filter: blur(28px); transform: scaleX(.86); }
    .workspace > p { margin: 0; color: #8d7180; font-size: 13px; letter-spacing: .02em; }
    .phone { position: relative; width: 236px; aspect-ratio: .5; }
    .device { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(-9px -5px 16px #fff8) drop-shadow(18px 28px 23px #4b233747); }
    .screen { position: absolute; inset: 7.03% 10.93%; display: flex; flex-direction: column; padding: 5% 6% 4%; border-radius: 9% / 4.5%; overflow: hidden; background: radial-gradient(circle at 50% 28%, #ffffff80, transparent 58%); box-shadow: inset 0 0 38px #fff8; }
    .brand { display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-left: -3px; color: #462e3b; font: 600 16px Playfair, Georgia, serif; }
    .brand img { width: 24px; height: 24px; }
    .title { position: relative; display: flex; flex-direction: column; align-items: flex-start; max-width: 180px; margin-top: 38px; color: #52152f; text-wrap: balance; }
    .title span { color: #8d7180; font: 500 12px/1.2 Jost, system-ui, sans-serif; letter-spacing: .045em; }
    .title strong { white-space: nowrap; color: #9c1c4c; font: italic 500 24px/1.06 Playfair, Georgia, serif; letter-spacing: -.035em; }
    .spacer { flex: 1; }
    .prompt { margin-bottom: 9px; color: #856d79; font: 400 11px Jost, system-ui, sans-serif; letter-spacing: .025em; }
    .input { min-height: 50px; display: flex; align-items: center; padding: 9px 11px; border: 1px solid #e8dfe3; border-radius: 10px; background: #ffffff99; color: #9c1c4c; font: italic 18px Georgia, serif; }
    .input i { width: 1px; height: 18px; margin-left: 3px; background: #9c1c4c; animation: blink 1s steps(1) infinite; }
    .send { display: flex; justify-content: space-between; align-items: center; min-height: 45px; margin-top: 10px; padding: 11px 13px; border-radius: 10px; background: #71334f; color: white; font-size: 11px; }
    .send b { font-size: 16px; font-weight: 400; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <main class="workspace">
    <div class="phone">
      <img class="device" src="assets/landing/phone-titanium.png" alt="">
      <div class="screen">
        <div class="brand"><img src="z_icons/icon.svg" alt=""><span>Wolkenworte</span></div>
        <div class="title"><span>Wortwolke für</span><strong>Lea &amp; Julian</strong></div>
        <div class="spacer"></div>
        <div class="prompt">Teile dein Wort</div>
        <div class="input"><span>Abenteuer</span><i></i></div>
        <div class="send"><span>Wort senden</span><b>↗</b></div>
      </div>
    </div>
    <p>Isolierter Screen-Mockup für schnelle Iterationen</p>
  </main>
</body>
</html>
