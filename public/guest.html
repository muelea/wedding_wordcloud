<!DOCTYPE html>
<html lang="de" data-theme="pastel">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Wortwolke</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Pastel theme (default) — matches the landing/create palette ── */
    :root {
      --bg:       #fffdfa;
      --bg2:      #fffdfa;
      --primary:  #400f26;
      --primary2: #9c1c4c;
      --accent:   #9c1c4c;
      --accent2:  #d1607e;
      --text:     #400f26;
      --muted:    #8a7178;
      --border:   rgba(193,146,47,0.35);
      --shadow:   rgba(64,15,38,0.09);
      --tag-bg:   rgba(247,238,223,0.55);
      --tag-bd:   rgba(193,146,47,0.32);
      --tag-tx:   #9c1c4c;
      --ph:       #b99aa3;
      --header-grad: rgba(247,238,223,0.7);
      --header-bd:   rgba(193,146,47,0.2);
      --orn:      rgba(193,146,47,0.55);
    }

    /* ── Neon theme ── */
    [data-theme="neon"] {
      --bg:       #000000;
      --bg2:      #000000;
      --primary:  #ff10f0;
      --primary2: #bf00ff;
      --accent:   #00fff2;
      --accent2:  #39ff14;
      --text:     #f5f0ff;
      --muted:    #b39ddb;
      --border:   rgba(255,16,240,0.40);
      --shadow:   rgba(255,16,240,0.35);
      --tag-bg:   rgba(255,16,240,0.14);
      --tag-bd:   rgba(255,16,240,0.40);
      --tag-tx:   #ff8cf5;
      --ph:       #7a6a99;
      --header-grad: rgba(0,255,242,0.16);
      --header-bd:   rgba(255,16,240,0.28);
      --orn:      rgba(191,0,255,0.75);
    }

    html, body {
      height: 100%;
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      font-family: 'Jost', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      transition: background 0.5s, color 0.5s;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 0 48px;
    }

    .header {
      width: 100%;
      text-align: center;
      padding: 36px 24px 28px;
      background: linear-gradient(180deg, var(--header-grad) 0%, transparent 100%);
      border-bottom: 1px solid var(--header-bd);
      transition: background 0.5s, border-color 0.5s;
    }

    .header .eyebrow {
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      transition: color 0.5s;
    }

    .header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(26px, 7vw, 36px);
      font-weight: 500;
      font-style: italic;
      color: var(--primary2);
      line-height: 1.2;
      transition: color 0.5s;
    }

    .header .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
      transition: color 0.5s;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px 0;
    }

    .prompt {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-style: italic;
      color: var(--primary2);
      text-align: center;
      margin-bottom: 28px;
      transition: color 0.5s;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 4px 28px var(--shadow);
    }

    #word-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 19px;
      color: var(--text);
      padding: 18px 16px 18px 22px;
      transition: color 0.5s;
    }

    #word-input::placeholder { color: var(--ph); font-style: italic; }

    #submit-btn {
      margin: 8px;
      padding: 12px 22px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s, background 0.5s;
      line-height: 1;
    }
    #submit-btn .heart-icon { width: 18px; height: auto; }

    #submit-btn:active { transform: scale(0.94); }
    #submit-btn:disabled { opacity: 0.40; cursor: default; }

    .char-counter {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      padding-right: 4px;
      transition: color 0.5s;
    }

    .flash {
      text-align: center;
      margin-top: 20px;
      height: 28px;
      font-size: 14px;
      color: var(--primary2);
      opacity: 0;
      transition: opacity 0.3s, color 0.5s;
    }
    .flash.show { opacity: 1; }

    .submitted-section { margin-top: 32px; }

    .submitted-label {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      transition: color 0.5s;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 10px; }

    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--tag-bd);
      color: var(--tag-tx);
      padding: 7px 16px;
      border-radius: 999px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 15px;
      animation: tagIn 0.35s ease both;
      transition: background 0.5s, border-color 0.5s, color 0.5s;
    }

    @keyframes tagIn {
      from { opacity: 0; transform: scale(0.8) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .ornament {
      text-align: center;
      color: var(--orn);
      font-size: 18px;
      margin: 32px 0 0;
      letter-spacing: 8px;
      transition: color 0.5s;
    }

    .error-state {
      text-align: center;
      margin-top: 60px;
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header class="header">
  <p class="eyebrow">Herzlich willkommen</p>
  <h1 id="couple-name">♡</h1>
  <p class="subtitle" id="event-title">Hochzeit</p>
</header>

<main class="card">
  <p class="prompt">Teile ein Wort für das Brautpaar&nbsp;✦</p>

  <div class="input-wrap">
    <input
      id="word-input"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      maxlength="30"
      placeholder="Liebe, Glück, Freude, Vertrauen…"
      aria-label="Ein Wort eingeben"
    />
    <button id="submit-btn" aria-label="Absenden"><svg class="heart-icon" viewBox="0 0 80 70" aria-hidden="true"><path d="M40 62C18 48 7 36 8 21c1-12 17-15 25-3C39 6 56 9 58 21c2 15-10 27-18 41Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 16c3-4 8-5 12-3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
  </div>
  <div class="char-counter"><span id="char-count">0</span> / 30</div>

  <div class="flash" id="flash"></div>

  <section class="submitted-section" id="submitted-section" hidden>
    <p class="submitted-label">Deine Wörter</p>
    <div class="tags" id="tags"></div>
  </section>

  <p class="ornament">· · ·</p>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
  // Slug comes from the URL: /e/<slug>
  const slug = location.pathname.split('/').filter(Boolean)[1];

  // Sync theme from URL param
  const urlTheme = new URLSearchParams(location.search).get('theme');
  if (urlTheme === 'neon' || urlTheme === 'pastel') {
    document.documentElement.dataset.theme = urlTheme;
  }

  const socket = io({ query: { slug } });
  const input   = document.getElementById('word-input');
  const btn     = document.getElementById('submit-btn');
  const flash   = document.getElementById('flash');
  const tags    = document.getElementById('tags');
  const section = document.getElementById('submitted-section');
  const charCount = document.getElementById('char-count');

  fetch(`/api/events/${encodeURIComponent(slug)}`)
    .then(r => r.json())
    .then(({ coupleName, eventTitle, theme }) => {
      document.getElementById('couple-name').textContent = coupleName;
      document.getElementById('event-title').textContent = eventTitle;
      document.title = coupleName + ' – Wortwolke';
      if (!urlTheme && (theme === 'neon' || theme === 'pastel')) {
        document.documentElement.dataset.theme = theme;
      }
    })
    .catch(() => {});

  input.addEventListener('input', () => { charCount.textContent = input.value.length; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) submitWord(); });
  btn.addEventListener('click', submitWord);

  function submitWord() {
    const word = input.value.trim();
    if (!word) return;
    btn.disabled = true;
    socket.emit('submit-word', word);
    input.value = '';
    charCount.textContent = '0';
  }

  socket.on('word-accepted', (word) => {
    btn.disabled = false;
    input.focus();
    flash.textContent = `„${word}" wurde hinzugefügt!`;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 2200);
    section.hidden = false;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = word;
    tags.prepend(tag);
  });

  socket.on('theme-change', (t) => {
    document.documentElement.dataset.theme = t;
  });

  socket.on('fatal-error', (msg) => {
    document.querySelector('main').innerHTML =
      '<p class="error-state">Diese Wortwolke wurde nicht gefunden.</p>';
  });

  socket.on('disconnect', () => { btn.disabled = true; });
  socket.on('connect',    () => { btn.disabled = false; });
</script>
</body>
</html>
