app = "wolkenworte"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_ENVIRONMENT = "production"
  PORT = "8080"
  PUBLIC_URL = "https://wolkenworte.io"
  DATABASE_APPLICATION_NAME = "wolkenworte-fly"
  DATABASE_CA_CERT_PATH = "certs/supabase-prod-ca-2021.crt"
  SUPABASE_STORAGE_BUCKET = "wolkenworte-private"
  EMAIL_DELIVERY_MODE = "live"
  MAINTENANCE_MODE = "false"
  ALLOW_TEST_DATA_RESET = "false"
  STRIPE_PAYMENT_MODE = "live"
  STRIPE_LIVE_PAYMENTS_ENABLED = "true"
  CHECKOUT_QUOTE_TTL_MINUTES = "30"
  PRINTFUL_FULFILLMENT_MODE = "live"
  PRINTFUL_ALLOW_ORDER_WRITES = "true"
  PRINTFUL_CONFIRM_LIVE_ORDERS = "true"
  SHOP_PRODUCT_MARKUP_PERCENT = "50"
  SHOP_PAYMENT_RESERVE_PERCENT = "3.65"
  SHOP_PAYMENT_RESERVE_FIXED_CENTS = "25"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 3500
    hard_limit = 5000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/health/ready"
    protocol = "http"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
