name: Deploy hosted test

on:
  workflow_dispatch:

concurrency:
  group: wolkenworte-hosted-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-migrate-deploy:
    runs-on: ubuntu-latest
    environment: hosted-test
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DATABASE_CA_CERT_PATH: certs/supabase-prod-ca-2021.crt
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: docker build --tag wolkenworte:${{ github.sha }} .

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl config validate --strict --config fly.toml --app wolkenworte
      - run: npm run db:migrate
      - run: flyctl deploy --remote-only --ha=false --config fly.toml --app wolkenworte --yes
      - run: npm run maintenance:configure-cron -- --url https://wolkenworte.fly.dev
      - run: npm run smoke:hosted -- https://wolkenworte.io
